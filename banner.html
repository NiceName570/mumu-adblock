<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06060a;color:#e6ffe6;font-family:'Inter',sans-serif;height:320px;width:1280px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 40%, rgba(0,255,102,0.12) 0%, transparent 60%), radial-gradient(circle at 70% 60%, rgba(0,200,255,0.08) 0%, transparent 50%)}
.glow-line{position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,#00ff66,#00ccff,#00ff66);box-shadow:0 0 20px #00ff66,0 2px 10px #00ccff}
.container{text-align:center;position:relative;z-index:2;padding:2rem 3rem;border:1px solid rgba(255,255,255,0.08);border-radius:18px;background:rgba(255,255,255,0.03);backdrop-filter:blur(8px)}
h1{font-family:'Orbitron',sans-serif;font-size:72px;letter-spacing:8px;text-transform:uppercase;background:linear-gradient(90deg,#00ff66,#00ccff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 40px rgba(0,255,102,0.45);line-height:1}
.subtitle{margin-top:14px;font-size:22px;color:#a8f0c6;letter-spacing:3px;text-transform:uppercase;font-weight:700}
.tagline{margin-top:16px;color:#8cf0b8;font-size:16px;letter-spacing:1px;opacity:0.9}
</style></head>
<body>
<div class="glow-line"></div>
<div class="container">
<h1>MuMu AdBlock</h1>
<div class="subtitle">BLOCK ADS / CLOSE LAN PORTS</div>
<div class="tagline">Zero drivers. Just firewall rules. Double-click and done.</div>
</div>
</body></html>
